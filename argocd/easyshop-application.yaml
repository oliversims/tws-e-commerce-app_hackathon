# =============================================================================
# easyshop-application.yaml
# =============================================================================
# Argo CD Application CR — same as "New App" in the UI.
# Apply on the bastion (needs Argo CD CRDs from stack 09):
#   kubectl apply -f argocd/easyshop-application.yaml
# =============================================================================

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: easyshop                    # App name in Argo CD
  namespace: argocd                 # Applications live in the argocd namespace
spec:
  project: default

  source:
    repoURL: https://github.com/oliversims/tws-e-commerce-app_hackathon.git
    targetRevision: master          # Git branch/tag
    path: kubernetes                # Folder Argo syncs

  destination:
    server: https://kubernetes.default.svc   # In-cluster API
    namespace: easyshop                      # Where resources are created

  syncPolicy:
    automated:
      prune: true                   # Delete cluster resources removed from Git
      selfHeal: true                # Revert manual drift on the cluster
    syncOptions:
      - CreateNamespace=true        # Create namespace easyshop if missing
