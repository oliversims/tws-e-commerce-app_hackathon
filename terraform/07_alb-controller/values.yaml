# =============================================================================
# 07_alb-controller / values.yaml  (Helm template — vars filled by Terraform templatefile)
# =============================================================================
# Overrides for AWS Load Balancer Controller. Chart defaults cover RBAC, etc.
# =============================================================================

# --- Replicas ---
replicaCount: ${replicaCount}   # How many controller pods to run

# --- Container image ---
image:
  repository: public.ecr.aws/eks/aws-load-balancer-controller  # Official AWS ECR image
  tag: v2.13.3                                                 # Controller version

# --- Cluster identity (from Terraform remote state) ---
clusterName: "${clusterName}"   # EKS cluster name the controller manages
region: "${region}"             # AWS region (e.g. us-east-1)
vpcId: "${vpcId}"               # VPC where the cluster lives

# --- Service account (IRSA annotation set in main.tf via --set) ---
serviceAccount:
  create: true                              # Create the SA in kube-system
  name: aws-load-balancer-controller        # SA name used by the pods
