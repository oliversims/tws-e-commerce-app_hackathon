# aws-load-balancer-controller — only overrides this stack needs.
# Chart defaults cover the rest (RBAC, IngressClass alb, etc.).

replicaCount: ${replicaCount}

image:
  repository: public.ecr.aws/eks/aws-load-balancer-controller
  tag: v2.13.3

clusterName: "${clusterName}"
region: "${region}"
vpcId: "${vpcId}"

serviceAccount:
  create: true
  name: aws-load-balancer-controller
