# kube-prometheus-stack — only overrides this stack needs.
# Before apply on the bastion: set alertmanager Slack api_url (do not commit secrets).

alertmanager:
  enabled: true
  config:
    route:
      group_by: ['namespace']
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 12h
      receiver: 'slack-notification'
      routes:
        - receiver: 'slack-notification'
          matchers:
            - severity = "critical"
    receivers:
      - name: 'slack-notification'
        slack_configs:
          - api_url: '' # Set on bastion only — do not commit Slack webhook URLs
            channel: '#alerts'
            send_resolved: true
  ingress:
    enabled: true
    ingressClassName: alb
    hosts:
      - alertmanager.simsoliver.com
    paths:
      - /
    pathType: Prefix
    annotations:
      alb.ingress.kubernetes.io/group.name: easyshop-app-lb
      alb.ingress.kubernetes.io/scheme: internet-facing
      alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:us-east-1:742934034265:certificate/7ff4a82e-fc52-4eea-b3d3-f9b23dec1971
      alb.ingress.kubernetes.io/target-type: ip
      alb.ingress.kubernetes.io/backend-protocol: HTTP
      alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80}, {"HTTPS":443}]'
      alb.ingress.kubernetes.io/ssl-redirect: '443'

grafana:
  enabled: true
  ingress:
    enabled: true
    ingressClassName: alb
    hosts:
      - grafana.simsoliver.com
    path: /
    annotations:
      alb.ingress.kubernetes.io/group.name: easyshop-app-lb
      alb.ingress.kubernetes.io/scheme: internet-facing
      alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:us-east-1:742934034265:certificate/7ff4a82e-fc52-4eea-b3d3-f9b23dec1971
      alb.ingress.kubernetes.io/target-type: ip
      alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80}, {"HTTPS":443}]'
      alb.ingress.kubernetes.io/ssl-redirect: '443'

prometheus:
  enabled: true
  ingress:
    enabled: true
    ingressClassName: alb
    hosts:
      - prometheus.simsoliver.com
    paths:
      - /
    pathType: Prefix
    annotations:
      alb.ingress.kubernetes.io/group.name: easyshop-app-lb
      alb.ingress.kubernetes.io/scheme: internet-facing
      alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:us-east-1:742934034265:certificate/7ff4a82e-fc52-4eea-b3d3-f9b23dec1971
      alb.ingress.kubernetes.io/target-type: ip
      alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80}, {"HTTPS":443}]'
      alb.ingress.kubernetes.io/ssl-redirect: '443'
