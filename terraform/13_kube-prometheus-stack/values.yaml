# =============================================================================
# 13_kube-prometheus-stack / values.yaml
# =============================================================================
# Only overrides this stack needs. Exporters come from chart defaults.
# Before apply on the bastion: set alertmanager Slack api_url (do not commit).
# =============================================================================

# --- Alertmanager: routes critical alerts to Slack; UI via ALB ---
alertmanager:
  enabled: true
  # Routing tree and Slack receiver
  config:
    route:
      group_by: ['namespace']      # Group alerts by namespace
      group_wait: 30s              # Wait before first notification in a group
      group_interval: 5m           # Wait before re-notifying a group
      repeat_interval: 12h         # Re-send if still firing
      receiver: 'slack-notification'
      routes:
        - receiver: 'slack-notification'
          matchers:
            - severity = "critical"  # Only critical alerts to this route
    receivers:
      - name: 'slack-notification'
        slack_configs:
          - api_url: ''            # Set on bastion only — do not commit webhook URLs
            channel: '#alerts'     # Slack channel name
            send_resolved: true    # Also notify when alerts clear
  # Admin HTTPS UI (operator IP only): https://alertmanager.simsoliver.com
  ingress:
    enabled: true
    ingressClassName: alb
    hosts:
      - alertmanager.simsoliver.com
    paths:
      - /
    pathType: Prefix
    annotations:
      alb.ingress.kubernetes.io/group.name: platform-admin-lb
      alb.ingress.kubernetes.io/inbound-cidrs: 68.195.155.202/32
      alb.ingress.kubernetes.io/scheme: internet-facing
      alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:us-east-1:742934034265:certificate/cfb83bd1-a366-41c1-b5c9-1fc16f01eea9
      alb.ingress.kubernetes.io/target-type: ip
      alb.ingress.kubernetes.io/backend-protocol: HTTP
      alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80}, {"HTTPS":443}]'
      alb.ingress.kubernetes.io/ssl-redirect: '443'

# --- Grafana: dashboards UI; queries Prometheus (chart default datasource) ---
grafana:
  enabled: true
  # Admin HTTPS UI (operator IP only): https://grafana.simsoliver.com
  ingress:
    enabled: true
    ingressClassName: alb
    hosts:
      - grafana.simsoliver.com
    path: /
    annotations:
      alb.ingress.kubernetes.io/group.name: platform-admin-lb
      alb.ingress.kubernetes.io/inbound-cidrs: 68.195.155.202/32
      alb.ingress.kubernetes.io/scheme: internet-facing
      alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:us-east-1:742934034265:certificate/cfb83bd1-a366-41c1-b5c9-1fc16f01eea9
      alb.ingress.kubernetes.io/target-type: ip
      alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80}, {"HTTPS":443}]'
      alb.ingress.kubernetes.io/ssl-redirect: '443'

# --- Prometheus: scrapes exporters, stores metrics, alerts → Alertmanager ---
prometheus:
  enabled: true
  # Admin HTTPS UI (operator IP only): https://prometheus.simsoliver.com
  ingress:
    enabled: true
    ingressClassName: alb
    hosts:
      - prometheus.simsoliver.com
    paths:
      - /
    pathType: Prefix
    annotations:
      alb.ingress.kubernetes.io/group.name: platform-admin-lb
      alb.ingress.kubernetes.io/inbound-cidrs: 68.195.155.202/32
      alb.ingress.kubernetes.io/scheme: internet-facing
      alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:us-east-1:742934034265:certificate/cfb83bd1-a366-41c1-b5c9-1fc16f01eea9
      alb.ingress.kubernetes.io/target-type: ip
      alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80}, {"HTTPS":443}]'
      alb.ingress.kubernetes.io/ssl-redirect: '443'
