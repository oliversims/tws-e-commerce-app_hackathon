# argo-cd — only overrides this stack needs (ALB Ingress + insecure behind TLS).

global:
  domain: argocd.simsoliver.com

configs:
  params:
    server.insecure: true

server:
  replicas: ${serverReplicas}
  ingress:
    enabled: true
    controller: aws
    ingressClassName: alb
    hostname: argocd.simsoliver.com
    annotations:
      alb.ingress.kubernetes.io/scheme: internet-facing
      alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:us-east-1:742934034265:certificate/7ff4a82e-fc52-4eea-b3d3-f9b23dec1971
      alb.ingress.kubernetes.io/group.name: easyshop-app-lb
      alb.ingress.kubernetes.io/target-type: ip
      alb.ingress.kubernetes.io/backend-protocol: HTTP
      alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80}, {"HTTPS":443}]'
      alb.ingress.kubernetes.io/ssl-redirect: '443'
    aws:
      backendProtocolVersion: GRPC
      serviceType: ClusterIP
