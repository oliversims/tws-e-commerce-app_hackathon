# =============================================================================
# 09_argocd / values.yaml
# =============================================================================
# Overrides for Argo CD UI behind ALB + TLS (server.insecure: TLS ends at ALB).
# Release name my-argo-cd → Deployments like my-argo-cd-argocd-server.
# =============================================================================

# --- Global ---
global:
  domain: argocd.simsoliver.com   # Hostname for Argo CD (admin ALB, operator IP)

# --- Server config ---
configs:
  params:
    server.insecure: true         # HTTP inside cluster; ALB terminates HTTPS

# --- Argo CD server + Ingress ---
server:
  replicas: 1
  ingress:
    enabled: true                 # Create Ingress for the UI
    controller: aws               # Use AWS ALB Ingress support in the chart
    ingressClassName: alb         # IngressClass from stack 07
    hostname: argocd.simsoliver.com
    annotations:
      alb.ingress.kubernetes.io/scheme: internet-facing
      alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:us-east-1:742934034265:certificate/cfb83bd1-a366-41c1-b5c9-1fc16f01eea9
      alb.ingress.kubernetes.io/group.name: platform-admin-lb
      alb.ingress.kubernetes.io/inbound-cidrs: 68.195.155.202/32  # Must match 05/06 allowed_ssh_cidr
      alb.ingress.kubernetes.io/target-type: ip
      alb.ingress.kubernetes.io/backend-protocol: HTTP
      alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80}, {"HTTPS":443}]'
      alb.ingress.kubernetes.io/ssl-redirect: '443'
    aws:
      backendProtocolVersion: GRPC   # ALB target group protocol version for Argo CD
      serviceType: ClusterIP         # Service type behind the Ingress
