# =============================================================================
# filebeat.yaml
# =============================================================================
# Helm values for Filebeat (log shipper). Chart: elastic/filebeat 8.5.1
# DaemonSet on each node: read EasyShop container logs → Elasticsearch.
# Needs ES Secrets: elasticsearch-master-credentials + elasticsearch-master-certs
# Install: helm upgrade --install my-filebeat ... -f helm-values/filebeat.yaml
# =============================================================================

# --- Image ---
imageTag: "8.5.1"                                        # Must match Elasticsearch chart version

# --- DaemonSet (one agent per node) ---
daemonset:
  enabled: true                                          # Run Filebeat as a DaemonSet

  # --- Auth env from Elasticsearch Secret ---
  extraEnvs:
    - name: ELASTICSEARCH_USERNAME                       # ES username for output
      valueFrom:
        secretKeyRef:
          name: elasticsearch-master-credentials         # Created by elasticsearch Helm chart
          key: username
    - name: ELASTICSEARCH_PASSWORD                       # ES password for output
      valueFrom:
        secretKeyRef:
          name: elasticsearch-master-credentials
          key: password

  # --- TLS CA from Elasticsearch Secret ---
  secretMounts:
    - name: elasticsearch-master-certs                   # Volume name inside the pod
      secretName: elasticsearch-master-certs             # Created by elasticsearch Helm chart
      path: /usr/share/filebeat/certs/                   # Mount path for ca.crt

  securityContext:
    runAsUser: 0                                         # Root required to read host container logs
    privileged: false                                    # Do not need full privileged mode

  resources:
    requests:
      cpu: "100m"                                        # Guaranteed CPU
      memory: "100Mi"                                    # Guaranteed memory
    limits:
      cpu: "500m"                                        # Max CPU
      memory: "200Mi"                                    # Max memory

  # --- Ship only EasyShop logs to Elasticsearch ---
  filebeatConfig:
    filebeat.yml: |
      filebeat.inputs:
      - type: container
        paths:
          - /var/log/containers/*easyshop*.log           # Only EasyShop app container logs
        processors:
        - add_kubernetes_metadata:
            host: ${NODE_NAME}
            matchers:
            - logs_path:
                logs_path: "/var/log/containers/"

      output.elasticsearch:
        hosts: '["https://${ELASTICSEARCH_HOSTS:elasticsearch-master:9200}"]'  # ES Service DNS
        username: '${ELASTICSEARCH_USERNAME}'
        password: '${ELASTICSEARCH_PASSWORD}'
        protocol: https
        ssl.certificate_authorities: ["/usr/share/filebeat/certs/ca.crt"]

# --- Deployment mode (not used — DaemonSet covers node log shipping) ---
deployment:
  enabled: false                                         # Disable Filebeat Deployment
