# =============================================================================
# kibana.yaml
# =============================================================================
# Helm values for Kibana (log UI). Chart: elastic/kibana 8.5.1
# Connects to elasticsearch-master using Shared Secrets from the ES chart.
# Public UI: https://kibana.simsoliver.com (admin ALB, operator IP).
# Install: helm upgrade --install my-kibana ... -f helm-values/kibana.yaml
# =============================================================================

# --- Elasticsearch connection ---
elasticsearchHosts: "https://elasticsearch-master:9200"              # In-cluster ES Service URL
elasticsearchCertificateSecret: elasticsearch-master-certs           # TLS CA Secret from ES chart
elasticsearchCertificateAuthoritiesFile: ca.crt                      # CA filename inside that Secret
elasticsearchCredentialSecret: elasticsearch-master-credentials      # Username/password Secret from ES chart

# --- Size ---
replicas: 1                                                          # Single Kibana pod
imageTag: "8.5.1"                                                    # Must match Elasticsearch chart version

resources:
  requests:
    cpu: "500m"                                                      # Guaranteed CPU
    memory: "1Gi"                                                    # Guaranteed memory
  limits:
    cpu: "1000m"                                                     # Max CPU
    memory: "2Gi"                                                    # Max memory

# --- Public Ingress (same ALB pattern as kubernetes/ingress.yaml) ---
ingress:
  enabled: true                                                      # Create an Ingress for Kibana
  className: "alb"                                                   # AWS Load Balancer Controller IngressClass
  pathtype: Prefix                                                   # Match paths by prefix
  annotations:
    alb.ingress.kubernetes.io/group.name: platform-admin-lb
    alb.ingress.kubernetes.io/inbound-cidrs: 68.195.155.202/32
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip                        # Register pod IPs
    alb.ingress.kubernetes.io/backend-protocol: HTTP                 # ALB → Kibana speaks HTTP
    alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:us-east-1:742934034265:certificate/655f7999-ceaf-4c25-91ae-0f18d4006906  # Same ACM as EasyShop
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80}, {"HTTPS":443}]'  # ALB listeners
    alb.ingress.kubernetes.io/ssl-redirect: '443'                    # Force HTTP → HTTPS
  hosts:
    - host: kibana.simsoliver.com                                    # ExternalDNS creates Route 53 record
      paths:
        - path: /                                                    # All paths under this host
