# =============================================================================
# elasticsearch.yaml
# =============================================================================
# Helm values for Elasticsearch (log store). Chart: elastic/elasticsearch 8.5.1
# Creates Service elasticsearch-master + credentials/certs Secrets + PVC.
# Install: helm upgrade --install my-elasticsearch ... -f helm-values/elasticsearch.yaml
# =============================================================================

# --- Cluster size (single-node lab) ---
replicas: 1                                              # One ES pod (master + data)
minimumMasterNodes: 1                                    # Quorum for master election with 1 node
clusterHealthCheckParams: "wait_for_status=yellow&timeout=1s"  # Yellow is OK with one node

# --- Image ---
imageTag: "8.5.1"                                        # Must match Filebeat + Kibana chart version

# --- Resources ---
resources:
  requests:
    cpu: "1000m"                                         # Guaranteed CPU (1 core)
    memory: "2Gi"                                        # Guaranteed memory
  limits:
    cpu: "1000m"                                         # Max CPU
    memory: "2Gi"                                        # Max memory (OOMKill if exceeded)

# --- Persistence (EBS via terraform/11_storage-class) ---
persistence:
  enabled: true                                          # Keep indexes across pod restarts

volumeClaimTemplate:
  accessModes: ["ReadWriteOnce"]                         # One node mounts read-write (EBS)
  storageClassName: ebs-storage-class                    # Must match terraform/11_storage-class
  resources:
    requests:
      storage: 15Gi                                      # EBS volume size for ES data
