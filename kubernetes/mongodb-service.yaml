# =============================================================================
# mongodb-service.yaml
# =============================================================================
# A stable DNS name inside the cluster. Not MongoDB itself.
#
#   Clients (EasyShop, migration)     →     this Service     →     Mongo pod
#   mongodb-service:27017                   ClusterIP              port 27017
#
# Used in MONGODB_URI. Password still comes from mongodb-credentials, not here.
# Not public on the internet.
# =============================================================================

# --- API & Kind ---
apiVersion: v1
kind: Service                         # DNS + port. Not the database process.

# --- Identity ---
metadata:
  name: mongodb-service               # Hostname in MONGODB_URI
  namespace: easyshop

# --- Networking ---
spec:
  ports:
    - port: 27017                     # Port clients call
      targetPort: 27017               # Port on the Mongo container
  selector:
    app: mongodb                      # Must match StatefulSet pod labels
