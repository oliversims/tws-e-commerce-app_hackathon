# =============================================================================
# mongodb-service.yaml
# =============================================================================
# This file gives MongoDB a stable DNS name inside the cluster.
# ConfigMap MONGODB_URI points here: mongodb://mongodb-service:27017/easyshop
# =============================================================================

# --- API & Kind ---
apiVersion: v1                     # Core API group
kind: Service                      # Stable network endpoint for MongoDB pods

# --- Identity ---
metadata:
  name: mongodb-service            # DNS used by app + migration Job
  namespace: easyshop              # App namespace

# --- Networking ---
spec:
  ports:
    - port: 27017                  # Port clients call on the Service
      targetPort: 27017            # Port on the MongoDB container
  selector:
    app: mongodb                   # Must match StatefulSet pod labels
