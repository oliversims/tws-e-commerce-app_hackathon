# =============================================================================
# ingress.yaml
# =============================================================================
# This file exposes https://easyshop.simsoliver.com via AWS ALB + ACM TLS.
# Needs: 07 ALB controller, 08 ExternalDNS, ACM ARN from 02_route53_acm.
# group.name shares one ALB with Argo CD / Grafana Ingresses.
# =============================================================================

# --- API & Kind ---
apiVersion: networking.k8s.io/v1   # Networking API for Ingress
kind: Ingress                      # HTTP(S) routing rules into the cluster

# --- Identity ---
metadata:
  name: easyshop-ingress           # Name of this Ingress object
  namespace: easyshop              # App namespace
  annotations:
    alb.ingress.kubernetes.io/group.name: easyshop-app-lb          # Share one ALB with other apps
    alb.ingress.kubernetes.io/scheme: internet-facing              # Public ALB (not internal)
    alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:us-east-1:742934034265:certificate/7ff4a82e-fc52-4eea-b3d3-f9b23dec1971  # ACM TLS cert
    alb.ingress.kubernetes.io/target-type: ip                      # Register pod IPs (not nodes)
    alb.ingress.kubernetes.io/backend-protocol: HTTP               # ALB → pods speak HTTP
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80}, {"HTTPS":443}]'  # ALB listeners
    alb.ingress.kubernetes.io/ssl-redirect: '443'                  # Force HTTP → HTTPS

# --- Routing rules ---
spec:
  ingressClassName: alb            # Use the ALB IngressClass from stack 07
  rules:
  - host: easyshop.simsoliver.com  # Public hostname (ExternalDNS creates Route 53 record)
    http:
      paths:
      - path: /                    # All paths under this host
        pathType: Prefix           # Prefix match (/, /api, /login, …)
        backend:
          service:
            name: easyshop-service # Forward to the easyshop Service
            port:
              number: 80           # Service port (maps to pod 3000)
