# =============================================================================
# ingress.yaml
# =============================================================================
# Public HTTPS door. Not the app. Not Mongo. Not a LoadBalancer Service.
#
#   Internet  →  ALB (created by stack 07 from this Ingress)
#             →  easyshop-service:80  →  website pods:3000
#
# Hostname easyshop.simsoliver.com: ExternalDNS (stack 08) writes Route 53.
# TLS cert: ACM from stack 02 (annotation below).
#
# This is the public shop ALB (easyshop-app-lb). Admin UIs use platform-admin-lb.
# =============================================================================

# --- API & Kind ---
apiVersion: networking.k8s.io/v1
kind: Ingress                         # HTTP(S) rules. The ALB controller does AWS.

# --- Identity + ALB settings ---
metadata:
  name: easyshop-ingress
  namespace: easyshop
  annotations:
    alb.ingress.kubernetes.io/group.name: easyshop-app-lb          # Public shop ALB
    alb.ingress.kubernetes.io/scheme: internet-facing              # Reachable from the internet
    alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:us-east-1:742934034265:certificate/655f7999-ceaf-4c25-91ae-0f18d4006906  # ACM cert (stack 02)
    alb.ingress.kubernetes.io/target-type: ip                      # ALB talks to pod IPs
    alb.ingress.kubernetes.io/backend-protocol: HTTP               # ALB → pods speak HTTP
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80}, {"HTTPS":443}]'
    alb.ingress.kubernetes.io/ssl-redirect: '443'                  # Force HTTP → HTTPS

# --- Routing: hostname → Service ---
spec:
  ingressClassName: alb               # Stack 07 IngressClass
  rules:
  - host: easyshop.simsoliver.com     # Public name (not created here; ExternalDNS does DNS)
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: easyshop-service    # Forward to the Service, not straight to pods
            port:
              number: 80
