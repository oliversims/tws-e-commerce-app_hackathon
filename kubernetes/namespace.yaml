# =============================================================================
# namespace.yaml
# =============================================================================
# A named folder in the cluster. Not a pod, not a disk, not a website.
#
#   Everything in kubernetes/ lands here (namespace: easyshop).
#   Other apps (argocd, logging, monitoring) stay in their own folders.
#
# Apply first (or let Argo CreateNamespace=true do it).
# =============================================================================

# --- API & Kind ---
apiVersion: v1
kind: Namespace                       # Isolated name box only

# --- Identity ---
metadata:
  name: easyshop                      # Folder name. Not the website Deployment.
