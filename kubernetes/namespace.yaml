# =============================================================================
# namespace.yaml
# =============================================================================
# This file tells Kubernetes: "Create an isolated folder named easyshop"
# All other manifests in this folder set namespace: easyshop so they land here.
# Apply this file FIRST.
# =============================================================================

# --- API & Kind ---
apiVersion: v1                 # Core API group (Namespaces live in v1)
kind: Namespace                # A Namespace isolates names and resources

# --- Identity ---
metadata:
  name: easyshop               # The namespace name (kubectl get ns easyshop)
