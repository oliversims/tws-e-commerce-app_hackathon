# =============================================================================
# hpa.yaml
# =============================================================================
# Replica dial for the website. Not a pod. Does not create Mongo or nodes.
#
#   Watches CPU on Deployment easyshop
#   Keeps average around 70% of requested CPU
#   Replicas stay between 3 and 5
#
# If new pods do not fit, they go Pending; Karpenter (stack 15) may add a node.
#
# Needs: terraform 12_metrics-server
# =============================================================================

# --- API & Kind ---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler         # Changes Deployment replica count only

# --- Identity ---
metadata:
  name: easyshop-hpa
  namespace: easyshop

# --- What to scale ---
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: easyshop                    # Must match easyshop-deployment.yaml
  minReplicas: 3                      # Never below 3
  maxReplicas: 5                      # Never above 5

  # --- When to scale ---
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70      # Aim for ~70% of requested CPU
