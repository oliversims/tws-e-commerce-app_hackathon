# =============================================================================
# hpa.yaml
# =============================================================================
# This file auto-scales the easyshop Deployment by CPU usage.
# Needs: terraform 12_metrics-server (provides CPU metrics for HPA).
# =============================================================================

# --- API & Kind ---
apiVersion: autoscaling/v2         # HPA API version 2 (supports resource metrics)
kind: HorizontalPodAutoscaler      # Scales Deployment replicas up/down

# --- Identity ---
metadata:
  name: easyshop-hpa               # Name of this HPA object
  namespace: easyshop              # Same namespace as the Deployment

# --- Scale target & bounds ---
spec:
  scaleTargetRef:
    apiVersion: apps/v1            # Target is a Deployment
    kind: Deployment
    name: easyshop                 # Must match Deployment metadata.name
  minReplicas: 2                   # Never scale below 2 pods
  maxReplicas: 5                   # Never scale above 5 pods

  # --- Metric: keep average CPU around 70% ---
  metrics:
    - type: Resource               # Built-in resource metric (CPU/memory)
      resource:
        name: cpu                  # Scale on CPU utilization
        target:
          type: Utilization        # Percentage of requests
          averageUtilization: 70   # Target ~70% of requested CPU across pods
