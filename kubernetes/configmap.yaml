# =============================================================================
# configmap.yaml
# =============================================================================
# Non-secret settings for EasyShop. Safe to put in Git.
#
#   This ConfigMap     →     EasyShop pod env
#   easyshop-config          NODE_ENV, NEXT_PUBLIC_API_URL, NEXTAUTH_URL
#
# Does NOT hold JWT or Mongo passwords. Those are K8s Secrets copied from AWS.
# Does NOT hold MONGODB_URI. The Deployment builds that from mongodb-credentials.
#
# Used by: easyshop-deployment.yaml (envFrom)
# =============================================================================

# --- API & Kind ---
apiVersion: v1
kind: ConfigMap                       # Plain config. Not a Secret.

# --- Identity ---
metadata:
  name: easyshop-config               # Deployment configMapRef name
  namespace: easyshop

# --- Values loaded as env vars (envFrom) ---
data:
  NODE_ENV: "production"                                      # Next.js production mode
  NEXT_PUBLIC_API_URL: "https://easyshop.simsoliver.com/api"  # Browser-facing API base URL
  NEXTAUTH_URL: "https://easyshop.simsoliver.com/"            # Must match the public hostname
