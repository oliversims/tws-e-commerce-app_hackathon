# =============================================================================
# configmap.yaml
# =============================================================================
# This file stores non-secret app settings as key/value pairs.
# The Deployment loads these as environment variables (envFrom).
# Secrets (JWT, Mongo passwords) come from External Secrets → AWS Secrets Manager.
# =============================================================================

# --- API & Kind ---
apiVersion: v1                 # Core API group
kind: ConfigMap                # Non-sensitive configuration data

# --- Identity ---
metadata:
  name: easyshop-config        # Referenced by Deployment as configMapRef / configMapKeyRef
  namespace: easyshop          # Must match the easyshop Namespace

# --- Data (plain strings → pod env vars) ---
data:
  MONGODB_URI: "mongodb://mongodb-service:27017/easyshop"   # App DB URL (cluster DNS to Mongo Service)
  NODE_ENV: "production"                                    # Next.js production mode
  NEXT_PUBLIC_API_URL: "https://easyshop.simsoliver.com/api"  # Browser-facing API base URL
  NEXTAUTH_URL: "https://easyshop.simsoliver.com/"          # Auth callbacks/redirects (must match Ingress host)
