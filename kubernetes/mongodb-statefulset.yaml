# =============================================================================
# mongodb-statefulset.yaml
# =============================================================================
# This file runs MongoDB as a StatefulSet (stable name mongodb-0 + PVC).
# Mounts mongodb-pvc at /data/db. Service selector app=mongodb must match labels.
# =============================================================================

# --- API & Kind ---
apiVersion: apps/v1                # Apps API for StatefulSets
kind: StatefulSet                  # Ordered, stable identity for stateful apps

# --- Identity ---
metadata:
  name: mongodb                    # StatefulSet name → pod mongodb-0
  namespace: easyshop              # App namespace

# --- Desired state ---
spec:
  serviceName: mongodb-service     # Headless/identity link to the MongoDB Service
  replicas: 1                      # Single MongoDB pod for this project

  # --- Pod selector ---
  selector:
    matchLabels:
      app: mongodb                 # Manages pods with this label

  # --- Pod template ---
  template:
    metadata:
      labels:
        app: mongodb               # Must match selector + Service selector
    spec:
      containers:
        - name: mongodb            # Container name inside the pod
          image: mongo:latest      # Official MongoDB image
          ports:
            - containerPort: 27017 # MongoDB listens here
          volumeMounts:
            - name: mongodb-storage
              mountPath: /data/db  # MongoDB data directory on the PVC
          resources:
            requests:
              memory: "256Mi"      # Minimum memory guaranteed
              cpu: "250m"          # Minimum CPU (0.25 core)
            limits:
              memory: "512Mi"      # Max memory before OOMKill
              cpu: "500m"          # Max CPU (0.5 core)

      # --- Volume: bind the PVC ---
      volumes:
        - name: mongodb-storage    # Volume name referenced by volumeMounts
          persistentVolumeClaim:
            claimName: mongodb-pvc # Must match mongodb-pvc.yaml metadata.name
