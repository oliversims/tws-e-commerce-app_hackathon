# =============================================================================
# external-secret-app.yaml
# =============================================================================
# Copy instruction. Does NOT create the AWS secret (you already did that).
#
#   AWS Secrets Manager     →     Kubernetes
#   easyshop/app                  Secret easyshop-secrets
#   (JSON: JWT_SECRET)            (key: JWT_SECRET)
#
# Why two names: the pod cannot read AWS. It can only read a K8s Secret.
# This file is the copy. Source stays in AWS. Local copy is for EasyShop.
#
# Needs: ClusterSecretStore aws-secrets-manager + terraform/14_external-secrets
# =============================================================================

# --- API & Kind ---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret                      # "Copy this AWS secret into the cluster"

# --- Identity (the copy job itself, not the AWS secret) ---
metadata:
  name: easyshop-secrets                  # Name of this ExternalSecret object
  namespace: easyshop

# --- Where to copy FROM ---
spec:
  refreshInterval: 1h                     # Re-read AWS every hour
  secretStoreRef:
    name: aws-secrets-manager             # ClusterSecretStore: "use AWS in us-east-1"
    kind: ClusterSecretStore

  # --- Where to copy TO (Kubernetes Secret the pod mounts) ---
  target:
    name: easyshop-secrets                # K8s Secret name (Deployment secretRef)
    creationPolicy: Owner                 # Operator creates/updates this K8s Secret only

  # --- What field to copy ---
  data:
    - secretKey: JWT_SECRET               # Key inside the K8s Secret
      remoteRef:
        key: easyshop/app                 # AWS secret name (already exists; not created here)
        property: JWT_SECRET              # JSON field inside easyshop/app
