# =============================================================================
# external-secret-app.yaml
# =============================================================================
# This file syncs AWS secret "easyshop/app" into a Kubernetes Secret.
# Creates easyshop-secrets (JWT_SECRET) for the easyshop Deployment.
# Replaces the old Git-stored secrets.yaml values.
# Requires: ClusterSecretStore aws-secrets-manager + terraform/14_external-secrets.
# =============================================================================

# --- API & Kind ---
apiVersion: external-secrets.io/v1beta1   # External Secrets CRD API
kind: ExternalSecret                      # Syncs one remote secret → one K8s Secret

# --- Identity ---
metadata:
  name: easyshop-secrets                  # ExternalSecret object name
  namespace: easyshop                      # App namespace

# --- Sync settings ---
spec:
  refreshInterval: 1h                     # How often ESO re-reads AWS
  secretStoreRef:
    name: aws-secrets-manager             # Must match ClusterSecretStore metadata.name
    kind: ClusterSecretStore              # Cluster-scoped store (not namespaced SecretStore)

  # --- Target K8s Secret ---
  target:
    name: easyshop-secrets                # Secret name referenced by the Deployment
    creationPolicy: Owner                 # ESO owns/creates this Secret

  # --- Field mapping (AWS JSON property → Secret key) ---
  data:
    - secretKey: JWT_SECRET               # Key the Deployment loads (signs login JWTs)
      remoteRef:
        key: easyshop/app                 # AWS Secrets Manager secret name
        property: JWT_SECRET              # JSON field inside that secret
