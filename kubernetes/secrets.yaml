# =============================================================================
# secrets.yaml
# =============================================================================
# This file stores sensitive values (JWT + NextAuth secrets).
# stringData lets you write plain text; Kubernetes stores them base64 in etcd.
# NOTE: Still in Git for this hackathon — use Sealed/External Secrets in real prod.
# =============================================================================

# --- API & Kind ---
apiVersion: v1                 # Core API group
kind: Secret                   # Sensitive configuration (credentials, tokens)

# --- Identity ---
metadata:
  name: easyshop-secrets       # Referenced by Deployment as secretRef / secretKeyRef
  namespace: easyshop          # Must match the easyshop Namespace

type: Opaque                   # Generic key/value secret (not TLS or dockerconfig)

# --- Secret data (plain in YAML → encoded in the cluster) ---
stringData:
  JWT_SECRET: "e5e425764a34a2117ec2028bd53d6f1388e7b90aeae9fa7735f2469ea3a6cc8c"       # Signs API JWTs
  NEXTAUTH_SECRET: "HmaFjYZ2jbUK7Ef+wZrBiJei4ZNGBAJ5IdiOGAyQegw="                      # Encrypts NextAuth session cookies
