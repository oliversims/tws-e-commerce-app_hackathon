# =============================================================================
# secrets.yaml
# =============================================================================
# WHAT: Sensitive values (JWT + NextAuth secrets) for the easyshop app.
# WHY:  Separate credentials from normal config (03). Deployment (07) reads them.
#
# EXAMPLE:
#   stringData lets you write the plain string in YAML.
#   Kubernetes stores it base64-encoded in the cluster.
#
#   kubectl get secret easyshop-secrets -n easyshop -o yaml
#   → data:
#       JWT_SECRET: ZTVlNDI1...        (base64, not plain text)
#
#   Decode one value:
#     kubectl get secret easyshop-secrets -n easyshop \
#       -o jsonpath='{.data.JWT_SECRET}' | base64 -d
#
# Keys:
#   JWT_SECRET       Signs API tokens — if leaked, attackers can forge tokens
#   NEXTAUTH_SECRET  Encrypts login session cookies
#
# NOTE: These are still in Git in this project (demo/hackathon). In real prod,
#       use sealed-secrets / External Secrets / CI injection instead.
# =============================================================================

apiVersion: v1
kind: Secret
metadata:
  name: easyshop-secrets
  namespace: easyshop
type: Opaque
stringData:
  JWT_SECRET: "e5e425764a34a2117ec2028bd53d6f1388e7b90aeae9fa7735f2469ea3a6cc8c"
  NEXTAUTH_SECRET: "HmaFjYZ2jbUK7Ef+wZrBiJei4ZNGBAJ5IdiOGAyQegw="
