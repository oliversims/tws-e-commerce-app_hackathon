# =============================================================================
# migration-job.yaml
# =============================================================================
# This file runs DB migrations once to completion (not a long-running Deployment).
# Image tag should match the migration image Jenkins pushed.
# To re-run: kubectl delete job db-migration -n easyshop then sync/apply again.
# =============================================================================

# --- API & Kind ---
apiVersion: batch/v1               # Batch API for Jobs
kind: Job                          # Run a pod until it succeeds, then stop

# --- Identity ---
metadata:
  name: db-migration               # Job name (must delete to re-run)
  namespace: easyshop              # App namespace

# --- Job pod template ---
spec:
  template:
    spec:
      containers:
      - name: migration            # Container that runs the migration tool
        image: simsoliver/easyshop-migration:1
        imagePullPolicy: Always    # Always pull (don't rely on a stale node cache)
        env:
        - name: MONGODB_URI        # Where migrations connect
          value: "mongodb://mongodb-service:27017/easyshop"  # Cluster DNS to Mongo Service
      restartPolicy: OnFailure     # Retry the pod if the migration process fails
