# =============================================================================
# migration-job.yaml
# =============================================================================
# One-shot seed/schema runner. Not the database. Not the website.
#
#   Image: simsoliver/easyshop-migration:1  (Jenkins, not mongo:latest)
#   Connects with the same MONGODB_URI as EasyShop, then exits (Completed).
#
# To re-run: delete this Job, then let Argo sync / apply again.
#   kubectl delete job db-migration -n easyshop
# =============================================================================

# --- API & Kind ---
apiVersion: batch/v1
kind: Job                             # Run until success, then stop

# --- Identity ---
metadata:
  name: db-migration
  namespace: easyshop

# --- One-shot pod ---
spec:
  template:
    spec:
      containers:
      - name: migration
        image: simsoliver/easyshop-migration:1    # Jenkins image, not mongo:latest
        imagePullPolicy: Always

        # --- Same Mongo URI(Uniform Resource Identifier — a standard address string that says what to connect to and how.) as easyshop-deployment.yaml ---
        env:
        - name: MONGO_USER
          valueFrom:
            secretKeyRef:
              name: mongodb-credentials   # K8s copy of AWS easyshop/mongodb
              key: username
        - name: MONGO_PASSWORD
          valueFrom:
            secretKeyRef:
              name: mongodb-credentials
              key: password
        - name: MONGODB_URI
          value: "mongodb://$(MONGO_USER):$(MONGO_PASSWORD)@mongodb-service:27017/easyshop?authSource=admin"
      restartPolicy: OnFailure        # Retry the container if the process fails
