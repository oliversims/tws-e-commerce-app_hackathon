# =============================================================================
# mongodb-pvc.yaml
# =============================================================================
# A request for a disk. Not MongoDB. Not a pod. Nothing runs here.
#
#   This PVC          →     AWS EBS volume (~5 GiB)
#   mongodb-pvc             mounted by mongodb-statefulset at /data/db
#
# Data survives pod restarts. Delete this PVC and the database is gone.
#
# Needs: terraform 10_ebs-csi-driver + 11_storage-class (ebs-storage-class)
# =============================================================================

# --- API & Kind ---
apiVersion: v1
kind: PersistentVolumeClaim           # "Give me a durable disk"

# --- Identity ---
metadata:
  name: mongodb-pvc                   # StatefulSet volumes.claimName
  namespace: easyshop

# --- Disk request ---
spec:
  accessModes:
    - ReadWriteOnce                   # One node at a time (EBS)
  storageClassName: ebs-storage-class # How to provision the volume (stack 11)
  resources:
    requests:
      storage: 5Gi                    # Size of the EBS volume
