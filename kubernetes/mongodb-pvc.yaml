# =============================================================================
# mongodb-pvc.yaml
# =============================================================================
# This file requests a 5 GiB persistent disk for MongoDB data (AWS EBS via CSI).
# Needs: terraform 10_ebs-csi-driver + 11_storage-class (ebs-storage-class).
# StatefulSet mounts this PVC at /data/db so data survives pod restarts.
# =============================================================================

# --- API & Kind ---
apiVersion: v1                     # Core API group
kind: PersistentVolumeClaim        # Request for durable storage

# --- Identity ---
metadata:
  name: mongodb-pvc                # Referenced by StatefulSet volumes.claimName
  namespace: easyshop              # App namespace

# --- Storage request ---
spec:
  accessModes:
    - ReadWriteOnce                # One node/pod mounts read-write (EBS limitation)
  storageClassName: ebs-storage-class   # Must match terraform/11_storage-class
  resources:
    requests:
      storage: 5Gi                 # Ask CSI for ~5 GiB EBS volume
