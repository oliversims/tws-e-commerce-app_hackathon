# =============================================================================
# easyshop-service.yaml
# =============================================================================
# A stable DNS name in front of website pods. Not the website. Not HTTPS.
#
#   Ingress / ALB     →     this Service :80     →     easyshop pods :3000
#
# Internal only (ClusterIP). The public hostname is on ingress.yaml.
# =============================================================================

# --- API & Kind ---
apiVersion: v1
kind: Service                         # DNS + port. Not the Next.js process.

# --- Identity ---
metadata:
  name: easyshop-service
  namespace: easyshop

# --- Networking ---
spec:
  type: ClusterIP                     # Not on the internet by itself
  ports:
    - port: 80                        # Port Ingress calls
      targetPort: 3000                # Port on the easyshop container
  selector:
    app: easyshop                     # Must match Deployment pod labels
