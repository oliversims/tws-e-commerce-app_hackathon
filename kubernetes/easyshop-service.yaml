# =============================================================================
# easyshop-service.yaml
# =============================================================================
# This file creates a stable virtual IP / DNS name in front of easyshop pods.
# Ingress calls the Service; the Service load-balances to pods labeled app=easyshop.
# Path: browser → ALB → Service:80 → pod:3000
# =============================================================================

# --- API & Kind ---
apiVersion: v1                 # Core API group
kind: Service                  # Stable network endpoint for a set of pods

# --- Identity ---
metadata:
  name: easyshop-service       # DNS: easyshop-service.easyshop.svc.cluster.local
  namespace: easyshop          # Must match the easyshop Namespace

# --- Networking ---
spec:
  type: NodePort               # Also opens a port on each node (debug); Ingress still uses ClusterIP path via ALB
  ports:
    - port: 80                 # Port clients/Ingress call on the Service
      targetPort: 3000         # Port on the easyshop container (Next.js)
      nodePort: 30000          # Fixed node port for optional direct access (VPC/bastion)
  selector:
    app: easyshop              # Must match Deployment pod labels
