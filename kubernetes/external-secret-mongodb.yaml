# =============================================================================
# external-secret-mongodb.yaml
# =============================================================================
# This file syncs AWS secret "easyshop/mongodb" into a Kubernetes Secret.
# Creates mongodb-credentials (username, password) for Mongo auth later.
# Requires: ClusterSecretStore aws-secrets-manager + terraform/14_external-secrets.
# =============================================================================

# --- API & Kind ---
apiVersion: external-secrets.io/v1beta1   # External Secrets CRD API
kind: ExternalSecret                      # Syncs one remote secret → one K8s Secret

# --- Identity ---
metadata:
  name: mongodb-credentials               # ExternalSecret object name
  namespace: easyshop                      # App namespace

# --- Sync settings ---
spec:
  refreshInterval: 1h                     # How often ESO re-reads AWS
  secretStoreRef:
    name: aws-secrets-manager             # Must match ClusterSecretStore metadata.name
    kind: ClusterSecretStore              # Cluster-scoped store (not namespaced SecretStore)

  # --- Target K8s Secret ---
  target:
    name: mongodb-credentials             # Secret name created/updated in this namespace
    creationPolicy: Owner                 # ESO owns/creates this Secret

  # --- Field mapping (AWS JSON property → Secret key) ---
  data:
    - secretKey: username                 # Key inside the K8s Secret
      remoteRef:
        key: easyshop/mongodb             # AWS Secrets Manager secret name
        property: username                # JSON field inside that secret
    - secretKey: password                 # Key inside the K8s Secret
      remoteRef:
        key: easyshop/mongodb             # Same AWS secret
        property: password                # JSON field inside that secret
