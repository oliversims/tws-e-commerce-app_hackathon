# =============================================================================
# external-secret-mongodb.yaml
# =============================================================================
# Copy instruction. Does NOT create the AWS secret (you already did that).
#
#   AWS Secrets Manager     →     Kubernetes
#   easyshop/mongodb              Secret mongodb-credentials
#   (JSON: username, password)    (keys: username, password)
#
# Why two names: Mongo and EasyShop cannot read AWS. They read a K8s Secret.
# This file is the copy. Source stays in AWS. Local copy is for the pods.
#
# Used by: mongodb-statefulset (create the DB user on first boot)
#          easyshop-deployment + migration-job (build MONGODB_URI)
#
# Needs: ClusterSecretStore aws-secrets-manager + terraform/14_external-secrets
# =============================================================================

# --- API & Kind ---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret                  # "Copy this AWS secret into the cluster"

# --- Identity (the copy job itself, not the AWS secret) ---
metadata:
  name: mongodb-credentials           # Name of this ExternalSecret object
  namespace: easyshop

# --- Where to copy FROM ---
spec:
  refreshInterval: 1h                 # Re-read AWS every hour
  secretStoreRef:
    name: aws-secrets-manager         # ClusterSecretStore: "use AWS in us-east-1"
    kind: ClusterSecretStore

  # --- Where to copy TO (Kubernetes Secret the pods mount) ---
  target:
    name: mongodb-credentials         # K8s Secret name the pods reference
    creationPolicy: Owner             # Operator creates/updates this K8s Secret only

  # --- What fields to copy ---
  data:
    - secretKey: username             # Key inside the K8s Secret
      remoteRef:
        key: easyshop/mongodb         # AWS secret name (already exists; not created here)
        property: username            # JSON field inside easyshop/mongodb
    - secretKey: password             # Key inside the K8s Secret
      remoteRef:
        key: easyshop/mongodb         # Same AWS secret
        property: password            # JSON field inside easyshop/mongodb
