# =============================================================================
# easyshop-deployment.yaml
# =============================================================================
# This file tells Kubernetes: "Run the easyshop Next.js website as pods"
# A Deployment keeps N copies running — if one crashes, K8s auto-restarts it.
# =============================================================================

# --- API & Kind ---
apiVersion: apps/v1        # Use the "apps" API group, version 1 (standard for Deployments)
kind: Deployment           # We're creating a Deployment (not a Pod, Service, etc.)

# --- Identity ---
metadata:
  name: easyshop           # Name of this Deployment object in Kubernetes
  namespace: easyshop      # Isolated namespace — keeps easyshop resources separate from others

# --- Desired State ---
spec:
  replicas: 2              # Run 2 identical pods at all times (HPA can scale this to 5)

  # --- Pod Selector ---
  selector:
    matchLabels:
      app: easyshop        # This Deployment manages any pod that has label "app=easyshop"

  # --- Pod Template (blueprint for each pod) ---
  template:
    metadata:
      labels:
        app: easyshop      # Every pod created gets this label (must match selector above)

    spec:
      # --- Hard topology spread: must use different nodes and different AZs ---
      # Needs 2 Ready nodes in 2 AZs (otherwise the 2nd pod can stay Pending).
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: easyshop
          matchLabelKeys:
            - pod-template-hash
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: easyshop
          matchLabelKeys:
            - pod-template-hash

      containers:
        - name: easyshop                      # Name of the container inside the pod
          image: simsoliver/easyshop-app:1    # Docker image to run (Docker Hub repo:tag)

          # --- Exposed Port ---
          ports:
            - containerPort: 3000             # The Next.js app listens on port 3000 inside the container

          # --- Environment (from ConfigMap + Secret; no duplicate env: block) ---
          envFrom:
            - configMapRef:
                name: easyshop-config         # MONGODB_URI, NODE_ENV, NEXT_PUBLIC_API_URL, NEXTAUTH_URL
            - secretRef:
                name: easyshop-secrets        # JWT_SECRET (from External Secrets / AWS)

          # --- Resource Limits ---
          resources:
            requests:
              memory: "256Mi"   # Minimum memory Kubernetes guarantees this container (256 MB)
              cpu: "200m"       # Minimum CPU guaranteed (200 millicores = 0.2 of a CPU core)
            limits:
              memory: "512Mi"   # Maximum memory allowed — if exceeded, container is killed (OOMKilled)
              cpu: "500m"       # Maximum CPU allowed (500 millicores = 0.5 of a CPU core)

          # --- Health Probes ---
          startupProbe:                       # "Is the app done starting up?"
            httpGet:
              path: /
              port: 3000
            failureThreshold: 30             # Allow up to 30 failures before giving up
            periodSeconds: 10                # Check every 10 seconds → max 30×10 = 5 min to start

          readinessProbe:                     # "Is the app ready to receive traffic?"
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 20
            periodSeconds: 15

          livenessProbe:                      # "Is the app still alive?"
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 25
            periodSeconds: 20
