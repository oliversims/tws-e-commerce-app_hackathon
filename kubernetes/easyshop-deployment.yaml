# =============================================================================
# easyshop-deployment.yaml
# =============================================================================
# The website. Jenkins image simsoliver/easyshop-app:1. Not Mongo. Not Ingress.
#
#   At pod start (not on each user request):
#     ConfigMap easyshop-config      →  NODE_ENV, URLs
#     Secret easyshop-secrets        →  JWT_SECRET  (login cookies)
#     Secret mongodb-credentials     →  MONGO_USER / MONGO_PASSWORD
#                                       then MONGODB_URI is built from those
#
#   User login: check Mongo with MONGODB_URI, sign cookie with JWT_SECRET.
#
# HPA may change replica count (3–5). This file sets the pod template.
# =============================================================================

# --- API & Kind ---
apiVersion: apps/v1
kind: Deployment                      # Keep N website pods running

# --- Identity ---
metadata:
  name: easyshop
  namespace: easyshop

# --- Desired state ---
spec:
  replicas: 3                         # Baseline; HPA can raise this to 5

  # --- Which pods this Deployment owns ---
  selector:
    matchLabels:
      app: easyshop

  # --- Pod blueprint ---
  template:
    metadata:
      labels:
        app: easyshop                 # Must match Service selector + HPA target
    spec:
      # --- Spread across nodes and AZs (Pending if a 3rd node/AZ is impossible) ---
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: easyshop
          matchLabelKeys:
            - pod-template-hash
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: easyshop
          matchLabelKeys:
            - pod-template-hash

      containers:
        - name: easyshop
          image: simsoliver/easyshop-app:1
          imagePullPolicy: Always             # Always pull; do not use a stale cache
          ports:
            - containerPort: 3000     # Next.js inside the container

          # --- Non-secret config + JWT (loaded whole at pod start) ---
          envFrom:
            - configMapRef:
                name: easyshop-config         # NODE_ENV, NEXT_PUBLIC_API_URL, NEXTAUTH_URL
            - secretRef:
                name: easyshop-secrets        # JWT_SECRET (K8s copy of AWS easyshop/app)

          # --- Mongo URI built from the K8s copy of AWS easyshop/mongodb ---
          env:
            - name: MONGO_USER
              valueFrom:
                secretKeyRef:
                  name: mongodb-credentials
                  key: username
            - name: MONGO_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mongodb-credentials
                  key: password
            - name: MONGODB_URI               # Built here; password must be URI-safe
              value: "mongodb://$(MONGO_USER):$(MONGO_PASSWORD)@mongodb-service:27017/easyshop?authSource=admin"

          # --- CPU / memory ---
          resources:
            requests:
              memory: "256Mi"         # Guaranteed memory
              cpu: "200m"             # Guaranteed CPU
            limits:
              memory: "512Mi"         # Max memory before OOMKill
              cpu: "500m"             # Max CPU

          # --- Health checks ---
          startupProbe:               # Still starting?
            httpGet:
              path: /
              port: 3000
            failureThreshold: 30      # Up to ~5 minutes to become ready
            periodSeconds: 10
          readinessProbe:             # Ready for traffic?
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 20
            periodSeconds: 15
          livenessProbe:              # Still alive?
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 25
            periodSeconds: 20
