# =============================================================================
# easyshop-deployment.yaml
# =============================================================================
# This file tells Kubernetes: "Run the easyshop Next.js website as pods"
# A Deployment keeps N copies running — if one crashes, K8s auto-restarts it.
# =============================================================================

# --- API & Kind ---
apiVersion: apps/v1        # Use the "apps" API group, version 1 (standard for Deployments)
kind: Deployment           # We're creating a Deployment (not a Pod, Service, etc.)

# --- Identity ---
metadata:
  name: easyshop           # Name of this Deployment object in Kubernetes
  namespace: easyshop      # Isolated namespace — keeps easyshop resources separate from others

# --- Desired State ---
spec:
  replicas: 2              # Run 2 identical pods at all times (HPA can scale this to 5)

  # --- Pod Selector ---
  selector:
    matchLabels:
      app: easyshop        # This Deployment manages any pod that has label "app=easyshop"

  # --- Pod Template (blueprint for each pod) ---
  template:
    metadata:
      labels:
        app: easyshop      # Every pod created gets this label (must match selector above)

    spec:
      containers:
        - name: easyshop                      # Name of the container inside the pod
          image: simsoliver/easyshop-app:1    # Docker image to run (Docker Hub repo:tag)
          imagePullPolicy: Always             # Always pull the latest image on pod start (never use cached)

          # --- Exposed Port ---
          ports:
            - containerPort: 3000             # The Next.js app listens on port 3000 inside the container

          # --- Environment Variables (bulk load) ---
          envFrom:
            - configMapRef:
                name: easyshop-config         # Load ALL keys from this ConfigMap as env vars (e.g. MONGODB_URI, NODE_ENV)
            - secretRef:
                name: easyshop-secrets        # Load ALL keys from this Secret as env vars (e.g. JWT_SECRET)

          # --- Environment Variables (explicit, one by one) ---
          # These are loaded individually for clarity — you can see exactly where each value comes from
          env:
            - name: NEXTAUTH_URL              # The public URL of the app (used by NextAuth for redirects)
              valueFrom:
                configMapKeyRef:
                  name: easyshop-config       # Source: ConfigMap named "easyshop-config"
                  key: NEXTAUTH_URL           # Specific key inside that ConfigMap

            - name: NEXTAUTH_SECRET           # Secret used by NextAuth to sign/encrypt session tokens
              valueFrom:
                secretKeyRef:
                  name: easyshop-secrets      # Source: Secret named "easyshop-secrets"
                  key: NEXTAUTH_SECRET        # Specific key inside that Secret

            - name: JWT_SECRET                # Secret used to sign JWT tokens for auth
              valueFrom:
                secretKeyRef:
                  name: easyshop-secrets      # Source: same Secret
                  key: JWT_SECRET             # Specific key inside that Secret

          # --- Resource Limits ---
          resources:
            requests:
              memory: "256Mi"   # Minimum memory Kubernetes guarantees this container (256 MB)
              cpu: "200m"       # Minimum CPU guaranteed (200 millicores = 0.2 of a CPU core)
            limits:
              memory: "512Mi"   # Maximum memory allowed — if exceeded, container is killed (OOMKilled)
              cpu: "500m"       # Maximum CPU allowed (500 millicores = 0.5 of a CPU core)

          # --- Health Probes ---
          # Kubernetes uses these to know if the app is starting, ready, or alive

          startupProbe:                       # "Is the app done starting up?"
            httpGet:
              path: /                         # Send HTTP GET to "/" on port 3000
              port: 3000
            failureThreshold: 30             # Allow up to 30 failures before giving up
            periodSeconds: 10                # Check every 10 seconds → max 30×10 = 5 min to start

          readinessProbe:                     # "Is the app ready to receive traffic?"
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 20          # Wait 20s after container starts before first check
            periodSeconds: 15                # Then check every 15 seconds
            # If this fails → pod is removed from the Service's load balancer (no traffic sent to it)

          livenessProbe:                      # "Is the app still alive and not frozen/crashed?"
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 25          # Wait 25s before first check
            periodSeconds: 20                # Then check every 20 seconds
            # If this fails → Kubernetes restarts the container automatically