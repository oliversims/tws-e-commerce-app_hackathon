# =============================================================================
# cluster-secret-store.yaml
# =============================================================================
# Phone book entry: "how to call AWS Secrets Manager".
# Does NOT hold JWT or Mongo passwords. Does NOT create AWS secrets.
#
#   This object                 used by
#   ClusterSecretStore            external-secret-app.yaml
#   name: aws-secrets-manager     external-secret-mongodb.yaml
#
# The name sounds like AWS. It is only a Kubernetes pointer.
# Auth: IRSA via ServiceAccount external-secrets (terraform/14_external-secrets).
# =============================================================================

# --- API & Kind ---
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore              # Cluster-wide "how to reach AWS"

# --- Identity (a pointer name, not an AWS secret) ---
metadata:
  name: aws-secrets-manager           # Name ExternalSecret objects look up (not an AWS name)

# --- How the operator authenticates to AWS ---
spec:
  provider:
    aws:
      service: SecretsManager         # AWS Secrets Manager (not SSM Parameter Store)
      region: us-east-1               # Where easyshop/app and easyshop/mongodb live
      auth:
        jwt:                          # IRSA: pod identity, not a static AWS key
          serviceAccountRef:
            name: external-secrets    # SA created by the Helm chart in stack 14
            namespace: external-secrets
