# =============================================================================
# cluster-secret-store.yaml
# =============================================================================
# This file tells External Secrets Operator how to reach AWS Secrets Manager.
# Uses IRSA via the external-secrets ServiceAccount (terraform/14_external-secrets).
# Cluster-scoped — referenced by ExternalSecret objects in the easyshop namespace.
# =============================================================================

# --- API & Kind ---
apiVersion: external-secrets.io/v1beta1   # External Secrets CRD API
kind: ClusterSecretStore                  # Cluster-wide store (not namespaced)

# --- Identity ---
metadata:
  name: aws-secrets-manager               # Referenced by ExternalSecret secretStoreRef

# --- AWS provider ---
spec:
  provider:
    aws:
      service: SecretsManager             # Pull from AWS Secrets Manager (not SSM)
      region: us-east-1                   # Must match where easyshop/* secrets live
      auth:
        jwt:                              # IRSA: short-lived token from a ServiceAccount
          serviceAccountRef:
            name: external-secrets        # SA created by the ESO Helm chart
            namespace: external-secrets    # Namespace of that SA (required for ClusterSecretStore)
